[package]
name = "ahrs"
version = "0.10.0"
authors = ["Jon Magnuson <jon.magnuson@gmail.com>"]
description = "A Rust port of Madgwick's AHRS algorithm"
repository = "https://github.com/jmagnuson/ahrs-rs"
documentation = "https://docs.rs/ahrs"
readme = "README.md"
keywords = ["ahrs", "madgwick", "imu", "kalman", "accelerometer"]
license = "MIT"
edition = "2024"
rust-version = "1.89"

[features]
default = ["std"]
std = ["nalgebra/std", "simba/std", "num-traits/std"]
field_access = []
simd = ["simba/wide"]
portable_simd = ["std", "simba/portable_simd"]

[lib]
name = "ahrs"
path = "src/lib.rs"

[[example]]
name = "simd"
required-features = ["simd"]

[[bench]]
name = "ahrs"
harness = false

[dependencies.nalgebra]
version = "0.35"
features = ["libm-force"]
default-features = false

[dependencies.simba]
version = "0.10.2"
default-features = false

[dependencies.num-traits]
version = "0.2"
default-features = false

[dev-dependencies.rand]
version = "0.10"

[dev-dependencies.approx]
version = "0.5"

[dev-dependencies.criterion]
version = "0.8"
