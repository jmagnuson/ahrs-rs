name: Test

on: [push, pull_request]

jobs:
  test:
    name: Scalar and stable SIMD (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.89.0", stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf
      - run: cargo test
      - run: cargo test --features simd,field_access
      - run: cargo test --release --no-default-features --features simd,field_access
      - run: cargo check --lib --no-default-features --target thumbv7em-none-eabihf
      - run: cargo check --lib --no-default-features --features simd --target thumbv7em-none-eabihf
      - run: cargo check --all-targets --features simd,field_access
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --features simd,field_access -- -D warnings

  portable:
    name: Portable SIMD
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [nightly-2026-10-01, nightly]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo test --all-features
      - run: cargo check --all-targets --all-features
